<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="mathGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#mathGrad2)"/>
  <polygon points="40,240 100,280 40,280" fill="#0284c7" opacity="0.5"/>
  <!-- Formula on Left: 1/2 + 3/4 = ? -->
  <g transform="translate(100, 110)">
    <!-- 1 / 2 -->
    <g transform="translate(0, 0)">
      <text x="30" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">1</text>
      <line x1="10" y1="46" x2="50" y2="46" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">2</text>
    </g>
    <!-- + -->
    <text x="90" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="50" fill="#ffffff" text-anchor="middle">+</text>
    <!-- 3 / 4 -->
    <g transform="translate(120, 0)">
      <text x="30" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">3</text>
      <line x1="10" y1="46" x2="50" y2="46" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">4</text>
    </g>
    <!-- = ? -->
    <text x="210" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="50" fill="#ffffff" text-anchor="middle">=</text>
    <text x="260" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">?</text>
  </g>
  <!-- Calculator Graphic on Right -->
  <g transform="translate(460, 85)">
    <rect width="105" height="150" rx="16" fill="#0284c7" stroke="#ffffff" stroke-width="4"/>
    <rect x="14" y="16" width="77" height="32" rx="6" fill="#e0f2fe"/>
    <!-- Buttons -->
    <circle cx="28" cy="68" r="8" fill="#ffffff"/>
    <circle cx="53" cy="68" r="8" fill="#ffffff"/>
    <circle cx="78" cy="68" r="8" fill="#ffffff"/>
    <circle cx="28" cy="94" r="8" fill="#ffffff"/>
    <circle cx="53" cy="94" r="8" fill="#ffffff"/>
    <circle cx="78" cy="94" r="8" fill="#ffffff"/>
    <circle cx="28" cy="120" r="8" fill="#ffffff"/>
    <circle cx="53" cy="120" r="8" fill="#ffffff"/>
    <circle cx="78" cy="120" r="8" fill="#38bdf8"/>
  </g>
</svg>
