<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="noteHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg2)"/>
  <!-- Notepad sheet -->
  <g transform="translate(140, 30)">
    <!-- Shadow -->
    <rect x="8" y="10" width="340" height="290" rx="8" fill="rgba(0,0,0,0.08)"/>
    <!-- Pad base -->
    <rect width="340" height="290" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Red clip/top -->
    <path d="M0 8 C0 3.5 3.5 0 8 0 L332 0 C336.5 0 340 3.5 340 8 L340 24 L0 24 Z" fill="url(#noteHeader)"/>
    <!-- Spiral holes -->
    <circle cx="50" cy="12" r="5" fill="#ffffff"/>
    <circle cx="110" cy="12" r="5" fill="#ffffff"/>
    <circle cx="170" cy="12" r="5" fill="#ffffff"/>
    <circle cx="230" cy="12" r="5" fill="#ffffff"/>
    <circle cx="290" cy="12" r="5" fill="#ffffff"/>
    <!-- Text on pad -->
    <text x="170" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#1e293b" text-anchor="middle" letter-spacing="2">PLAN</text>
    <text x="170" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#e11d48" text-anchor="middle" letter-spacing="2">WRITE</text>
    <text x="170" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#1e293b" text-anchor="middle" letter-spacing="2">IMPROVE</text>
  </g>
  <!-- Pen on right -->
  <g transform="translate(490, 80) rotate(22)">
    <rect x="0" y="0" width="16" height="180" rx="8" fill="#0f172a"/>
    <polygon points="0,180 8,210 16,180" fill="#94a3b8"/>
    <polygon points="6,200 8,210 10,200" fill="#0f172a"/>
    <rect x="4" y="20" width="8" height="45" rx="3" fill="#e2e8f0"/>
  </g>
</svg>
